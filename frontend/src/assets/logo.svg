<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-label="Baseera">
  <title>Baseera</title>
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="56" stroke="#00BC7D" stroke-width="6" fill="none" />

  <!-- Eye almond shape (cyan) -->
  <path
    d="M16 64 C 30 38, 98 38, 112 64 C 98 90, 30 90, 16 64 Z"
    fill="none"
    stroke="#00B8DB"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Iris (teal-green circle) -->
  <circle cx="64" cy="64" r="20" fill="#00BC7D" />

  <!-- Pupil highlight (darker teal) -->
  <circle cx="64" cy="64" r="9" fill="#007855" />

  <!-- Small specular highlight on the pupil -->
  <circle cx="69" cy="59" r="3" fill="#FFFFFF" opacity="0.85" />
</svg>
